name: One-time review fixes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/review-findings
      - name: Apply reviewed fixes
        run: echo '' | base64 --decode | python3
      - name: Commit to fix branch
        run: git config user.name 'github-actions[bot]' && git config user.email '41898282+github-actions[bot]@users.noreply.github.com' && git add -A && git commit -m 'Fix reviewed accessibility and interaction issues' && git push origin HEAD:fix/review-findings
